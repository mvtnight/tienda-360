openapi: 3.0.1
info:
  title: Pedidos360 API (Amazon API Gateway HTTP API)
  description: >
    API HTTP (Gateway) que envía /api/pedidos al BFF de pedidos. El API Gateway
    valida el JWT (JWT authorizer) con el MISMO issuer y audience que el BFF:
      issuer   -> https://login.microsoftonline.com/<TENANT_ID>/v2.0
      audience -> api://<PEDIDOS_API_CLIENT_ID>
    Si el token es inválido o falta, responde 401 sin llegar al backend.
  version: 1.0.0

servers:
  - url: https://<api-id>.execute-api.<region>.amazonaws.com

paths:
  /:
    get:
      responses:
        '200':
          description: BFF health check
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://<ALB-DNS>/health
        payloadFormatVersion: '1.0'
        connectionType: INTERNET

  /{proxy+}:
    x-amazon-apigateway-any-method:
      security:
        - PedidosJwtAuthorizer: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: ANY
        uri: http://<ALB-DNS>/{proxy}
        payloadFormatVersion: '1.0'
        connectionType: INTERNET
      responses: {}

components:
  securitySchemes:
    PedidosJwtAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authorizer:
        type: jwt
        identitySource: $request.header.Authorization
        jwtConfiguration:
          audience:
            - api://<PEDIDOS_API_CLIENT_ID>
          issuer: https://login.microsoftonline.com/<TENANT_ID>/v2.0