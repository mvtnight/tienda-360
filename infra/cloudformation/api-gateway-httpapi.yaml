AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pedidos360 - Amazon API Gateway HTTP API que valida el JWT de Azure AD
  (mismo issuer/audience que el BFF) y proxya a un ALB.

Parameters:
  EnvName:
    Type: String
    Default: dev
  TenantId:
    Type: String
    Description: Directory (tenant) ID de Azure AD/Entra ID
  ApiClientId:
    Type: String
    Description: Client ID (Application ID) de la app "pedidos-api"
  ALBDnsName:
    Type: String
    Description: DNS name del Application Load Balancer del backend, p.ej. pedidos360-alb-xxxx.us-east-1.elb.amazonaws.com

Resources:
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'pedidos360-httpapi-${EnvName}'
      Description: Gateway de Pedidos360 - valida JWT Azure AD antes de llegar al BFF/backend
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false

  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Sub 'api://${ApiClientId}'
        Issuer: !Sub 'https://login.microsoftonline.com/${TenantId}/v2.0'
      Name: pedidos360-jwt-authorizer

  ProxyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      ConnectionType: INTERNET
      Description: Forwarding al ALB del backend
      Uri: !Sub 'http://${ALBDnsName}/{proxy}'

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'ANY /{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub 'integrations/${ProxyIntegration}'

  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /'
      Target: !Sub 'integrations/${ProxyIntegration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: prod
      AutoDeploy: true

Outputs:
  ApiEndpoint:
    Description: Endpoint del API Gateway (usar como PEDIDOS_API_URL en el BFF / bffUrl en el SPA)
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'