AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pedidos360 - Amazon API Gateway HTTP API (API Manager). Expone rutas explícitas
  por recurso, habilita CORS para el frontend y valida el JWT de Azure AD (mismo
  issuer/audience que el BFF) en TODAS las rutas. Un token válido sin el scope
  'access_as_user' recibe 403; sin token o con token inválido recibe 401.

Parameters:
  EnvName:
    Type: String
    Default: dev
  TenantId:
    Type: String
    Description: Directory (tenant) ID de Azure AD/Entra ID
  ApiClientId:
    Type: String
    Description: Client ID (Application ID) de la app "pedidos-api"
  ALBDnsName:
    Type: String
    Description: DNS del ALB del backend, p.ej. pedidos360-alb-xxxx.us-east-1.elb.amazonaws.com
  SpaOrigin:
    Type: String
    Default: http://localhost:4200
    Description: "Origen(es) de la SPA habilitados por CORS en el API Manager (separar varios con coma). Ej: http://localhost:4200,https://xxxx.cloudfront.net"

Resources:
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'pedidos360-httpapi-${EnvName}'
      Description: API Manager de Pedidos360 - valida JWT Azure AD y proxya a los microservicios
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false
      CorsConfiguration:
        AllowOrigins: !Split [ ',', !Ref SpaOrigin ]
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        ExposeHeaders:
          - Authorization
        MaxAge: 3600
        AllowCredentials: false

  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Sub 'api://${ApiClientId}'
        # La app API (accessTokenAcceptedVersion v1.0 sin definir) emite tokens v1.0
        # (iss = sts.windows.net/<tid>/, ver 1.0) para TODOS los flujos (PKCE y ROPC).
        # El authorizer valida el issuer EXACTO del tenant, por lo que tokens de otros
        # emisores (iss distinto) se rechazan con 401.
        Issuer: !Sub 'https://sts.windows.net/${TenantId}/'
      Name: pedidos360-jwt-authorizer

  # Integraciones por ruta (HTTP_PROXY). El path del cliente NO se añade al
  # IntegrationUri: la URL debe contener el path completo del backend, admitiendo
  # variables del path de la ruta ({id}) que el gateway sustituye al reenviar.
  HealthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      PayloadFormatVersion: '1.0'
      ConnectionType: INTERNET
      Description: GET /health al backend vía ALB
      IntegrationUri: !Sub 'http://${ALBDnsName}/health'

  ListPedidosIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      PayloadFormatVersion: '1.0'
      ConnectionType: INTERNET
      Description: GET /api/pedidos al backend vía ALB
      IntegrationUri: !Sub 'http://${ALBDnsName}/api/pedidos'

  GetPedidoIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      PayloadFormatVersion: '1.0'
      ConnectionType: INTERNET
      Description: GET /api/pedidos/{id} al backend vía ALB
      IntegrationUri: !Sub 'http://${ALBDnsName}/api/pedidos/{id}'

  CreatePedidoIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: '1.0'
      ConnectionType: INTERNET
      Description: POST /api/pedidos al backend vía ALB
      IntegrationUri: !Sub 'http://${ALBDnsName}/api/pedidos'

  UpdateEstadoIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: PATCH
      PayloadFormatVersion: '1.0'
      ConnectionType: INTERNET
      Description: PATCH /api/pedidos/{id}/estado al backend vía ALB
      IntegrationUri: !Sub 'http://${ALBDnsName}/api/pedidos/{id}/estado'

  DeletePedidoIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: DELETE
      PayloadFormatVersion: '1.0'
      ConnectionType: INTERNET
      Description: DELETE /api/pedidos/{id} al backend vía ALB
      IntegrationUri: !Sub 'http://${ALBDnsName}/api/pedidos/{id}'

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /health'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Sub 'integrations/${HealthIntegration}'

  ListPedidosRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /api/pedidos'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Sub 'integrations/${ListPedidosIntegration}'

  GetPedidoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /api/pedidos/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Sub 'integrations/${GetPedidoIntegration}'

  CreatePedidoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'POST /api/pedidos'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Sub 'integrations/${CreatePedidoIntegration}'

  UpdateEstadoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'PATCH /api/pedidos/{id}/estado'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Sub 'integrations/${UpdateEstadoIntegration}'

  DeletePedidoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'DELETE /api/pedidos/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - access_as_user
      Target: !Sub 'integrations/${DeletePedidoIntegration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      # Stage $default: la URL publica queda sin prefijo (/prod) y el request path
      # se reenvia tal cual al backend (GET /api/pedidos -> BFF /api/pedidos).
      # Con un stage con nombre, el prefijo se incluye en el path del backend y
      # Spring responde "No static resource prod/..." (HTTP 500).
      StageName: $default
      AutoDeploy: true

Outputs:
  ApiEndpoint:
    Description: Endpoint del API Manager (usar como PEDIDOS_API_URL en el BFF / bffUrl en el SPA)
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  ApiId:
    Description: ID del API Manager
    Value: !Ref Api