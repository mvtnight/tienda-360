spring.application.name=pedidos360-backend-tests

# Props que normalmente viven en el application.properties principal
app.cors.allowed-origins=http://localhost:4200
azure.tenant-id=test-tenant
app.exposed-client-id=test-client
app.exposed-app-uri=api://test-client

# En tests el JwtDecoder se reemplaza por uno de prueba basado en claves locales.
spring.security.oauth2.resourceserver.jwt.audiences[0]=test-client

# Base en memoria aislada de los tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1