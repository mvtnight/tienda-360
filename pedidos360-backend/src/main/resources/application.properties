spring.application.name=pedidos360-backend
server.port=8090

# Azure AD / Entra ID del curso
#   AZURE_TENANT_ID             -> id del tenant (directory ID)
#   AZURE_EXPOSED_APP_CLIENT_ID -> client id de la app de API "pedidos-api"
#   AZURE_EXPOSED_APP_URI       -> app id URI (api://<client-id>)
azure.tenant-id=${AZURE_TENANT_ID:0b4bca41-b3f5-427c-aeac-2dbcd055f91d}
app.exposed-client-id=${AZURE_EXPOSED_APP_CLIENT_ID:6da3f8f4-905c-4c76-abf0-c711d0dd3926}
app.exposed-app-uri=${AZURE_EXPOSED_APP_URI:api://6da3f8f4-905c-4c76-abf0-c711d0dd3926}

# Resource server: la validación (JWKS, iss, aud, exp/nbf) está en config/JwtDecoderConfig

# JPA (H2 en memoria para esta etapa; en EC2 podrá apuntar a una BD real)
spring.datasource.url=jdbc:h2:mem:pedidos360;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS (SPA de desarrollo)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===== RabbitMQ (mensajeria de eventos de dominio) =====
# En local apunta al cluster Docker (node1 :5672). En EC2 se sobreescribe por env vars.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# ACK manual: cada @RabbitListener decide basicAck/basicNack (ver messaging/*)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.initial-interval=300ms
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.template.retry.max-interval=2s

# Nombre de la aplicacion consumidora (aparece en RabbitMQ)
app.rabbitmq.consumer-name=${RABBITMQ_CONSUMER:pedidos360-backend}
