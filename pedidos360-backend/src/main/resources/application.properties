spring.application.name=pedidos360-backend
server.port=8090

# Azure AD / Entra ID del curso
#   AZURE_TENANT_ID             -> id del tenant (directory ID)
#   AZURE_EXPOSED_APP_CLIENT_ID -> client id de la app de API "pedidos-api"
#   AZURE_EXPOSED_APP_URI       -> app id URI (api://<client-id>)
azure.tenant-id=${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}
app.exposed-client-id=${AZURE_EXPOSED_APP_CLIENT_ID:00000000-0000-0000-0000-000000000000}
app.exposed-app-uri=${AZURE_EXPOSED_APP_URI:api://00000000-0000-0000-0000-000000000000}

# Resource server: la validación (JWKS, iss, aud, exp/nbf) está en config/JwtDecoderConfig

# JPA (H2 en memoria para esta etapa; en EC2 podrá apuntar a una BD real)
spring.datasource.url=jdbc:h2:mem:pedidos360;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS (SPA de desarrollo)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}