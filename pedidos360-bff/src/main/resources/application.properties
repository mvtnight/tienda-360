spring.application.name=pedidos360-bff
server.port=8085

# ============================================================
# IDaaS: Azure AD (Entra ID) del curso
# Igual que el API Manager, el BFF valida la firma (JWKS), iss,
# aud, exp y nbf del token ANTES de dejar consumir /bff/**.
# La validación está implementada en config/JwtDecoderConfig.
# ============================================================
azure.tenant-id=${AZURE_TENANT_ID:0b4bca41-b3f5-427c-aeac-2dbcd055f91d}
app.exposed-client-id=${AZURE_EXPOSED_APP_CLIENT_ID:6da3f8f4-905c-4c76-abf0-c711d0dd3926}
app.exposed-app-uri=${AZURE_EXPOSED_APP_URI:api://6da3f8f4-905c-4c76-abf0-c711d0dd3926}

# ============================================================
# Backend de destino (API Manager)
#   Local : http://localhost:8090
#   AWS   : endpoint del API Gateway, p. ej.
#           https://xxxxx.execute-api.us-east-1.amazonaws.com/prod
# ============================================================
bff.api-url=${PEDIDOS_API_URL:http://localhost:8090}

# CORS (SPA de desarrollo)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}